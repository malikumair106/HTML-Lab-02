<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Job Appliction Form</h1><br>
    <label for="">Applicant Name</label>
    <input type="text"><br><br>
    <label for="">Email</label>
    <input type="email"> <br><br>
    <label for="">Phone Number</label>
    <input type="number"><br><br>   
    <label for="">Password</label>
    <input type="password"><br><br> 
    <label for="">Gender</label><br><br>
    <label for="">Male</label>
    <input type="radio">  
     <label for="">Female</label>
    <input type="radio"><br><br>
    
    <label for="">Qualifications</label>
    <select name="" id="">
        <option value="">Select Qualifications</option>
        <option value="">Matric</option>
        <option value="">FSC</option>
        <option value="">BS</option>
        <option value="">MS</option>
    </select><br><br>

    <label for="">Cities</label>
    <input type="text" list="cities">
    <datalist id="cities">
        <option value="Sargodha"></option>
        <option value="Lahore"></option>
        <option value="Islamabad"></option>
        <option value="Quetta"></option>
    </datalist><br><br>

    <label for="">Salary</label>
    <input type="number"><br><br>

    <label for="">Date</label>
    <input type="date"><br><br>

    <label for="">Upload CV here</label>
    <input type="file"><br><br>

    <label for="Write your cover letter">Write your cover letter</label>
    <textarea name="" id="" rows="5" cols="20" ></textarea><br><br>

    <input type="submit">
    <input type="reset">
</body>
</html>
