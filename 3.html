<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Digital Media Creator Showcase</title>
</head>
<body>

    <h1>Digital Media Showcase</h1>

    
    <h2>Latest Video Reel</h2>
    <video width="640" height="360" controls loop muted poster="images/poster-custom.jpg">
        <source src="videos/reel.mp4" type="video/mp4">
        <source src="videos/reel.webm" type="video/webm">
        Your browser does not support the video tag.
    </video>

    <br><br>

    
    <h2>Podcast Teaser</h2>
    <audio controls autoplay loop>
        <source src="audio/podcast-teaser.mp3" type="audio/mpeg">
        <source src="audio/podcast-teaser.ogg" type="audio/ogg">
        Your browser does not support the audio element.
    </audio>

    <br><br>

    <h2>Interactive Map / Web Preview</h2>
    <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3318.12345!2d72.9!3d33.6!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzPCsDM2JzAwLjAiTiA3MsKwNTQnMDAuMCJF!5e0!3m2!1sen!2s!4v1600000000000" 
        width="640" 
        height="360" 
        frameborder="1">
    </iframe>

</body>
</html>
